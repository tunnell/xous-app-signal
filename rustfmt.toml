# Mirrors betrusted-io/xous-core's rustfmt.toml so xas code reads
# like the ecosystem it targets. Differences: the ignore list covers
# this repo's vendored trees instead of xous-core's.
#
# NOTE: not yet applied repo-wide — a mechanical `cargo +nightly fmt`
# commit is deliberately deferred until the in-flight worker refactor
# (PR #38) merges, to avoid manufacturing conflicts. Until then CI
# runs the fmt check as a soft gate (continue-on-error).

# Don't format vendored upstream forks — their delta vs upstream is
# tracked in vendor/*.diff and must stay minimal. Belt: CI scopes
# `cargo fmt --check` to the first-party crates with -p flags;
# suspenders: this ignore covers direct `cargo fmt` invocations.
ignore = [
    "vendor/**",
]

newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
max_width = 110
use_small_heuristics = "Max"

# Unstable features below (require nightly rustfmt, like xous-core)
unstable_features = true
style_edition = "2024"
comment_width = 110
group_imports = "StdExternalCrate"
normalize_doc_attributes = true
format_code_in_doc_comments = true
format_macro_bodies = true
format_macro_matchers = true
format_strings = false
wrap_comments = true
fn_single_line = true
reorder_impl_items = true
reorder_imports = true
reorder_modules = true
