[package]
name = "xous-app-signal"
description = "Xous app: Signal client built on the Whisperfish stack (presage + libsignal-service-rs + libsignal)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Short pronouncable name "xas" for the on-device binary.
name = "xas"
path = "src/main.rs"

[dependencies]
# Stage 8: spawn the manager worker thread + drive Hello/GetWhoami
# round-trips. The presage-store-pddb dep is direct (not just
# transitive through the bridge) because the binary owns the store
# and hands a clone to the worker.
xous-signal-bridge = { path = "../xous-signal-bridge" }
presage-store-pddb = { path = "../presage-store-pddb" }
async-channel = { workspace = true }

# Stage 9c: the UI layer. main.rs constructs the worker, then hands
# the cmd/event channels to Ui::new and calls Ui::run.
xous-app-signal-ui = { path = "../xous-app-signal-ui" }

# Stage 9b: log facade. Boot events log::info! through here so the
# Renode UART tester can assert on them. Hosted binds env_logger
# below; rv32-xous binds xous-api-log via the integration step
# (Stage 9b follow-up at hardware-deploy time).
log = "0.4"

[target.'cfg(not(target_os = "xous"))'.dependencies]
# Stage 9b: env_logger initializes from RUST_LOG; defaults to
# info-level. Pulled only for hosted builds to keep the rv32 dep
# graph clean. Stage 9b follow-up swaps in xous-api-log.
env_logger = { version = "0.11", default-features = false }

# Stage 1 carry-over (the smol primitives are used by the bridge
# transitively, but the binary references nothing from them
# directly any more — Stage 1's smoke test moved into the bridge's
# `tests` module).

# Stage 9a follow-up to Stage 6.1 phase 3f: getrandom 0.3 custom
# backend. The cfg `getrandom_backend="custom"` set in
# `.cargo/config.toml` for rv32-xous makes getrandom expect an
# extern `__getrandom_v03_custom` function provided by the user
# binary; without it the rv32 release build won't link. We import
# the crate here just for `getrandom::Error` (the extern's return
# type), gated to the rv32-xous target.
[target.'cfg(target_os = "xous")'.dependencies]
getrandom = { version = "0.3", default-features = false }

# Stage 9b-deploy: route `log::info!` through `xous-api-log`. The
# `xous-log` server (in the baseline Xous image at boot) forwards
# log records to the hardware UART, which is what the Renode Robot
# test asserts on. Pinned to the version other apps in xous-core
# use, so we resolve to the same crates.io release the published
# image links against.
xous-api-log = "0.1.69"
