[package]
name = "xous-modals-ipc"
description = "Hand-rolled Modals IPC client. rv32-xous only. Replicates the wire surface of xous-core's `services/modals` for the one operation we need (`show_notification` with optional QR-code overlay), bypassing the full GAM dep cascade that the upstream `modals` crate pulls in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Stage 14a precedent: same approach as `xous-pddb-ipc`. Replicates
# just the IPC opcodes we use, copying the rkyv wire structs verbatim
# from xous-core, avoiding the workspace-merge cascade.

[dependencies]
xous = "0.9.70"
xous-ipc = "0.10.10"
xous-names = { package = "xous-api-names", version = "0.9.71" }
# Trng is path-dep'd in the parent workspace; we just declare it here.
trng = { path = "../../../repos/xous-core/services/trng" }
rkyv = { version = "0.8.8", default-features = false, features = ["std", "alloc"] }
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
log = "0.4"
