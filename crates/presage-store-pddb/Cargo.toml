[package]
name = "presage-store-pddb"
description = "PDDB-backed implementation of presage's storage traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# presage pinned to HEAD as of Stage 4 (commit 600c4ed). docs/REPORT.md
# Decision 2 documents the patches we'll likely need to apply against it
