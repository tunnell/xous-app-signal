[package]
name = "presage-store-pddb"
description = "PDDB-backed implementation of presage's storage traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# presage pinned to HEAD as of Stage 4 (commit 600c4ed). The workspace
# [patch."https://github.com/whisperfish/presage"] in xous-app-signal's
# top-level Cargo.toml redirects this to vendor/presage/presage where the
# Stage 7 (Decision 2) tokio-removal patches live.
presage = { git = "https://github.com/whisperfish/presage", rev = "600c4ed" }

# Serde + JSON for state serialization. We use JSON (not bincode) so the
# on-disk format is debuggable from `pddbcli` dumps. Same choice
# presage-store-sqlite makes; cost is small for the < 1 KiB state blobs
# we serialize. Per `docs/REPORT.md` Decision 1.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Used to derive the per-uuid+profilekey lookup key for the
# `signal.profiles` dict. Same pattern as presage-store-sled
# (`profile_key_for_uuid` at vendor/presage/presage-store-sled/src/lib.rs:275).
sha2 = "0.10"

# Error type derives.
thiserror = "1"

# `futures-lite::future::block_on` is used in unit tests to drive the
# async store API without pulling tokio into the production dep tree.
futures-lite = { workspace = true }

# Stage 5a/b uses async-trait for IdentityKeyStore / SessionStore /
# PreKeyStore / KyberPreKeyStoreExt etc. — the libsignal protocol
# storage traits all use #[async_trait(?Send)] in their definitions,
# and our impls have to match.
async-trait = "0.1"

# Stage 5b: KyberPreKeyStoreExt's stale-marking methods take
# `chrono::DateTime<Utc>` per the trait signature. We don't act on the
# timestamps for now (matches presage-store-sqlite), but the type has
# to be in scope for the impl to compile.
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Stage 5c: ContentBody serialization for messages — protobuf round-trip
# via prost, matching presage-store-sled's ContentProto pattern.
# Pinned to 0.13 to match libsignal-service-rs's `prost = "0.13"`; using
# 0.14 here would compile but `presage::proto::Content` would only impl
# `prost_0_13::Message`, so `encode_to_vec`/`decode` wouldn't resolve.
prost = "0.13"

# Used by IdentityKeyStore to log unrecognized-identity TOFU events.
# Already a transitive dep through presage / libsignal-service-rs;
# declaring it here directly so the import doesn't depend on a
# transitive resolution that could change.
tracing = "0.1"

# Stage 5c: base64-encode the group master_key inside the per-thread
# dictionary-name hash. Same hashing scheme presage-store-sled uses
# (vendor/presage/presage-store-sled/src/content.rs:471-485).
base64 = "0.22"

[dev-dependencies]
# `RegistrationData` construction in tests needs a few presage / libsignal
# constructors. They come transitively through `presage`; we only need
# `phonenumber` for parsing the dummy E.164 in fixtures.
phonenumber = "0.3"
rand = "0.9"
