[workspace]
resolver = "2"
members = [
    "crates/presage-store-pddb",
    "crates/xous-net-bridge",
    "crates/xous-signal-bridge",
    "crates/xous-app-signal",
    "vendor/libsignal-service-rs",
]
exclude = [
    # Vendored as a whole workspace; we consume specific crates from it.
    # Other vendored copies we don't want to recompile on every cargo cmd.
    "vendor/curve25519-dalek",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = []
publish = false

# Smol-rs async primitives, pinned to the HEAD revs as of Stage 1
# (verified at ~/precursor-signal/repos/<crate>/git log --oneline -1).
# Replaces Tokio per docs/REPORT.md Decision 2. ~21 kLoC vendored audit
# surface vs. Tokio's >100 kLoC.
[workspace.dependencies]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "f98b30b" }
async-executor = { git = "https://github.com/smol-rs/async-executor", rev = "543403e" }
async-channel = { git = "https://github.com/smol-rs/async-channel", rev = "35a63c4" }
async-lock = { git = "https://github.com/smol-rs/async-lock", rev = "29f0ff9" }
event-listener = { git = "https://github.com/smol-rs/event-listener", rev = "2e9db21" }
futures-lite = { git = "https://github.com/smol-rs/futures-lite", rev = "3dc587f" }
futures-timer = { git = "https://github.com/async-rs/futures-timer", rev = "07dbe53" }

# Mirrors xous-core's [profile.release] settings:
#   https://github.com/betrusted-io/xous-core/blob/main/Cargo.toml#L154-L161
# debug = true keeps DWARF in the on-disk binary for hardware crash analysis.
# strip = false preserves symbol info for the same reason.
# For binary-size measurements, build with --profile=release-small (defined below).
[profile.release]
codegen-units = 1
debug = true
strip = false
lto = "fat"
incremental = true
opt-level = "s"
# panic = "abort"  # uncomment to reduce file size further at the cost of panic output

# Size-measurement profile per docs/REPORT.md "Binary size strategy".
# Use this when running `cargo bloat --crates -p xous-signal-app --profile=release-small`
# to get an accurate picture of on-disk size without DWARF debug info.
[profile.release-small]
inherits = "release"
debug = false
strip = "symbols"

# Mirrors xous-core's [patch.crates-io]:
#   https://github.com/betrusted-io/xous-core/blob/main/Cargo.toml#L164-L196
#
# Only the git-based patches are mirrored here. xous-core's path-based patches
# (`aes` -> services/aes, `getrandom` -> imports/getrandom) reference paths
# that only exist inside the xous-core tree; they're TODO for a later stage
# (likely the rv32 hardware integration in ROADMAP Stage 9) when we either
# (a) merge this workspace into xous-core, or (b) vendor those forks here.
#
# We do NOT mirror xous-core's curve25519-dalek patch. It conflicts with
# libsignal's `signalapp/curve25519-dalek` pin (see docs/REPORT.md Risk #3).
# Resolution is being investigated separately.
[patch.crates-io]
sha2 = { git = "https://github.com/betrusted-io/hashes.git", branch = "sha2-v0.10.8-xous" }

# Smol-rs primitives also patched here so transitive uses (e.g. `futures-lite`
# pulled by `async-executor` from crates.io) converge on our pinned git versions
# rather than producing duplicate copies. Without these, `cargo tree -d` flags
# multiple copies of the same crate at the same version but different sources.
async-task = { git = "https://github.com/smol-rs/async-task", rev = "f98b30b" }
async-executor = { git = "https://github.com/smol-rs/async-executor", rev = "543403e" }
async-channel = { git = "https://github.com/smol-rs/async-channel", rev = "35a63c4" }
async-lock = { git = "https://github.com/smol-rs/async-lock", rev = "29f0ff9" }
event-listener = { git = "https://github.com/smol-rs/event-listener", rev = "2e9db21" }
futures-lite = { git = "https://github.com/smol-rs/futures-lite", rev = "3dc587f" }
futures-timer = { git = "https://github.com/async-rs/futures-timer", rev = "07dbe53" }

[patch.crates-io.ring]
git = "https://github.com/betrusted-io/ring-xous"
rev = "5f86cb10bebd521a45fb3abb06995200aeda2948"

# curve25519-dalek: vendored `betrusted-io/curve25519-dalek` fork +
# version bump 4.1.2 → 4.1.3 + lizard module port. Carries the driver
# for Precursor's curve25519 IP-core HW accelerator at
# vendor/curve25519-dalek/curve25519-dalek/src/backend/serial/u32e/.
#
# **Precursor-only.** The IP core is on Precursor only (per bunnie); the
# Bao1x tape-out has a different PKE engine and would need a separate
# backend. We're targeting Precursor for now; Bao1x support is a future
# stage swap.
#
# The u32e backend is selected at compile time by setting
# `--cfg curve25519_dalek_backend="u32e_backend"`. We do that
# automatically for the rv32-xous target via .cargo/config.toml; on
# hosted Linux the same code falls back to the portable Rust backend, so
# tests/CI run unaffected.
#
# Our delta over the upstream betrusted-io fork:
#   - bump version 4.1.2 → 4.1.3 in curve25519-dalek/Cargo.toml so the
#     [patch.crates-io] redirect matches what libsignal's zkgroup
#     declares (curve25519-dalek = "4.1.3")
#   - port the src/lizard/ module (~6 files) from
#     signalapp/curve25519-dalek (signal-curve25519-4.1.3 tag) — adds
#     4 RistrettoPoint methods used by zkgroup. Additive vs upstream;
#     no API conflicts.
#   - one `pub mod lizard;` line in src/lib.rs.
# That's the entire delta — easy to keep current with the betrusted-io
# fork and easy to audit.
[patch.crates-io.curve25519-dalek]
path = "vendor/curve25519-dalek/curve25519-dalek"

[patch.crates-io.curve25519-dalek-derive]
path = "vendor/curve25519-dalek/curve25519-dalek-derive"

# libsignal's Cargo.toml also imports curve25519-dalek directly via the
# git URL `https://github.com/signalapp/curve25519-dalek` (aliased as
# `curve25519-dalek-signal`). [patch.crates-io] doesn't redirect git
# sources, so we additionally patch the git URL here. Both pointers now
# resolve to the same vendored crate, eliminating the duplicate-types
# error from two RistrettoPoint definitions.
[patch."https://github.com/signalapp/curve25519-dalek"]
curve25519-dalek = { path = "vendor/curve25519-dalek/curve25519-dalek" }
curve25519-dalek-derive = { path = "vendor/curve25519-dalek/curve25519-dalek-derive" }

# Stage 6: redirect presage's git dep on libsignal-service-rs to our
# vendored, forked copy at vendor/libsignal-service-rs/. This is where the
# Decision 3 transport patches live (in progress this stage).
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service-rs" }

# Stage 7: redirect presage to our vendored, forked copy at vendor/presage/.
# This is where the Decision 2 tokio-removal patches live.
[patch."https://github.com/whisperfish/presage"]
presage = { path = "vendor/presage/presage" }

# Stage 2 forced an earlier resolution of one of the path-based patches
# we deferred at Stage 0: cross-compiling rustls/ring for rv32 pulls in
# `getrandom`, whose upstream crate doesn't recognize Xous as a target.
# xous-core has a forked `getrandom` at `imports/getrandom` that calls
# Xous's TRNG. We point at it via an absolute path on this dev box; this
# is brittle (only works on machines where xous-core is at this path),
# and is one of the open questions for Stage 9 — see docs/ROADMAP.md
# "Open questions / things to revisit". Long-term resolution: either
# merge our workspace into xous-core's tree, or fork the getrandom
# patch into a separate publishable repo.
[patch.crates-io.getrandom]
path = "/home/tunnell/precursor-signal/repos/xous-core/imports/getrandom"

# TODO (ROADMAP Stage 9): wire up the `aes` patch (also path-based,
# `xous-core/services/aes`) the same way once `aes` shows up
# transitively. Not blocking yet because no current dep pulls `aes`.
# See docs/REPORT.md "Decision 6" for context.
