[package]
# be a sign or warning of (an imminent event, typically an unwelcome one).
name = "presage"
version = "0.8.0-dev"
authors = ["Gabriel Féron <g@leirbag.net>"]
edition = "2021"
license = "AGPL-3.0-only"

[features]
default = []
# brings libsignal-net and all its dependencies
cdsi = ["libsignal-service/cdsi"]

[dependencies]
libsignal-service = { git = "https://github.com/whisperfish/libsignal-service-rs", rev = "782c0d6bf0c4a6ab52f98d7b6d950a13f28f3020", default-features = false, features = [
    "phonenumber",
] }

base64 = "0.22"
futures = "0.3"
hex = "0.4.3"
rand = "0.9"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10.8"
thiserror = "1.0"
# Stage 7 (Xous fork): tokio removed from production deps per
# docs/REPORT.md Decision 2. Replacements:
#   - tokio::sync::Mutex      → async-lock::Mutex
#   - tokio::task::spawn_local / tokio::spawn → executor.spawn(...).detach()
#   - tokio::task::spawn_blocking → inline (single-threaded executor on Xous)
#   - tokio::time::error::Elapsed → custom unit error
# Versions taken from xous-app-signal workspace [workspace.dependencies].
async-executor = { git = "https://github.com/smol-rs/async-executor", rev = "543403e" }
async-lock = { git = "https://github.com/smol-rs/async-lock", rev = "29f0ff9" }
futures-timer = { git = "https://github.com/async-rs/futures-timer", rev = "07dbe53" }
tracing = "0.1"
url = "2.5"
derive_more = { version = "2.1.0", features = ["debug"] }
bytes = { version = "1.7.2", features = ["serde"] }

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_async = "0.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
