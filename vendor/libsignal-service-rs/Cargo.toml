[package]
name = "libsignal-service"
version = "0.1.0"
authors = ["Ruben De Smet <ruben.de.smet@rubdos.be>", "Gabriel Féron <g@leirbag.net>"]
edition = "2021"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
libsignal-net = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0", optional = true }
libsignal-net-infra = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0", optional = true }
signal-crypto = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
usernames = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }

aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
ctr = "0.9"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
derive_more = { version = "2.1", features = ["debug"] }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
phonenumber = { version = "0.3", optional = true }
prost = "0.13"
rand = "0.9"
rand_core_06 = { version = "0.6", package = "rand_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.85"
sha2 = "0.10"
thiserror = "2.0"
url = { version = "2.1", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

# http
# Stage 6.1: add explicit `http` dep for the type-only Method/StatusCode/header
# references that used to flow through reqwest's re-exports. Same crate either
# way — `reqwest::Method` and `http::Method` are literally the same type.
http = "1"
# Stage 6.1 phase 3b: reqwest + reqwest-websocket removed. Replaced by the
# transport::HttpClient trait + RequestBuilder / HttpResponse types defined
# in src/transport.rs; impl provided by xous-net-bridge::SyncHttpClient.

tracing = { version = "0.1", features = ["log"] }
tracing-futures = "0.2"

# Stage 6.5 verification (2026-05-06): tokio was previously declared
# here as a normal dep — left over from upstream's `#[tokio::test]`
# annotations on async tests. After the Stage 6 transport replacement
# every src/ file mentioning `tokio` does so only in comments
# (transport.rs:326, websocket/mod.rs:233, push_service/mod.rs:141).
# Dropping the normal dep saves ~300 KB of dep-graph size and removes
# the only Stage 6.5 cargo-tree match for the C-runtime regex; see
# stage/REPORT-6.5.md.

# Stage 6.1: replaces tokio::time::interval_at in src/websocket/mod.rs.
# futures-timer is sync at the leaf (single OS-thread parker) but
# integrates with futures::select! the same way tokio's Interval does.
futures-timer = { git = "https://github.com/async-rs/futures-timer", rev = "07dbe53" }

# Stage 6.1 phase 3c: async-channel for the WebSocket frame channels in
# transport::WebSocketChannels. The WS pump impl in xous-net-bridge runs
# on a sync worker thread; async-channel has both sync (send_blocking /
# recv_blocking) and async (send / recv) APIs, so the channel pair
# bridges the sync↔async boundary without an intermediate translation.
async-channel = { git = "https://github.com/smol-rs/async-channel", rev = "35a63c4" }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["macros", "rt"] }

[features]
# Stage 6 (Xous fork): CDSI disabled by default. CDSI transitively pulls
# boring-sys (BoringSSL) which doesn't target rv32-xous and needs libclang
# at host build time. Per docs/REPORT.md Decision 5.
default = []
phonenumber = ["dep:phonenumber"]
cdsi = ["dep:libsignal-net", "dep:libsignal-net-infra"]

# (Originally a `[patch.crates-io]` block redirecting curve25519-dalek lived
# here. The redirect is done at the workspace root in xous-app-signal/Cargo.toml
# so this vendored copy doesn't need its own. Removed entirely because cargo
# warns on a non-root [patch] section even when it's empty.)
