[package]
name = "libsignal-service"
version = "0.1.0"
authors = ["Ruben De Smet <ruben.de.smet@rubdos.be>", "Gabriel Féron <g@leirbag.net>"]
edition = "2021"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
libsignal-net = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0", optional = true }
libsignal-net-infra = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0", optional = true }
signal-crypto = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }
usernames = { git = "https://github.com/signalapp/libsignal", tag = "v0.91.0" }

aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
ctr = "0.9"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
derive_more = { version = "2.1", features = ["debug"] }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
phonenumber = { version = "0.3", optional = true }
prost = "0.13"
rand = "0.9"
rand_core_06 = { version = "0.6", package = "rand_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.85"
sha2 = "0.10"
thiserror = "2.0"
url = { version = "2.1", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

# http
# Stage 6.1: add explicit `http` dep for the type-only Method/StatusCode/header
# references that used to flow through reqwest's re-exports. Same crate either
# way — `reqwest::Method` and `http::Method` are literally the same type.
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-manual-roots", "stream"] }
reqwest-websocket = { version = "0.4.2", features = ["json"] }

tracing = { version = "0.1", features = ["log"] }
tracing-futures = "0.2"

tokio = { version = "1.0", features = ["macros"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["macros", "rt"] }

[features]
# Stage 6 (Xous fork): CDSI disabled by default. CDSI transitively pulls
# boring-sys (BoringSSL) which doesn't target rv32-xous and needs libclang
# at host build time. Per docs/REPORT.md Decision 5.
default = []
phonenumber = ["dep:phonenumber"]
cdsi = ["dep:libsignal-net", "dep:libsignal-net-infra"]

[patch.crates-io]
# Stage 6: removed the upstream `curve25519-dalek` patch. Workspace-level
# patch in xous-app-signal/Cargo.toml redirects to vendor/curve25519-dalek/
# (betrusted-io fork + lizard port + version bump). When this fork is
# consumed via the workspace's `[patch."...whisperfish/libsignal-service-rs"]`,
# the workspace patches take effect; this section is left empty so we don't
# fight ourselves.
